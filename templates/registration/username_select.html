{% extends "base.html" %}
{% block legacy_css %}{% endblock %}
{% block title_row %}{% endblock %}

{% block body %}
    <div class="pn-auth">
        <h1 class="pn-title">{% if content_title %}{{ content_title }}{% else %}{{ title }}{% endif %}</h1>
        <form action="" method="post" class="pn-card pn-card-pad pn-form">
            {% csrf_token %}
            <table>{{ form.as_table() }}</table>
            <button type="submit" class="pn-btn pn-btn-block">{{ _('Continue >') }}</button>
        </form>
    </div>
{% endblock %}
