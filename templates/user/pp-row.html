<span title="{{ breakdown.sub_long_status }}" class="pn-v pn-v-{{ breakdown.sub_result_class }}">
    {{- breakdown.sub_short_status -}}
</span>

<div class="pn-sub-score">{{ breakdown.sub_points|floatformat(0) }} / {{ breakdown.sub_total|floatformat(0) }}</div>

<div class="pn-sub-main">
    <div class="pn-sub-name">
        <a href="{{ url('problem_detail', breakdown.problem_code) }}">{{ breakdown.problem_name }}</a>
    </div>
    <div class="pn-sub-meta">{{ relative_time(breakdown.sub_date) }} &middot; {{ breakdown.sub_lang }}</div>
</div>

<div class="pn-sub-usage pn-pp">
    <a href="{{ url('submission_status', breakdown.sub_id) }}">{{ breakdown.points|floatformat }} {{ _('points') }}</a>
</div>
